name: Build r8s

# Fork build for the Galaxy S20 FE (Exynos, r8s) only.
# Same steps as upstream Build, minus the uploads that need upstream's secrets:
# the ROM zip is published as a workflow artifact instead.
# No official signing keys here, so the scripts fall back to the AOSP test keys.

on:
  workflow_dispatch:
    inputs:
      beta:
        description: 'Beta build (same as upstream "debug" type)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TARGET: r8s
      # Faster final zip compression (larger file), as in upstream's r8s port workflow.
      UNICA_BROTLI_QUALITY: '1'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu python-is-python3 python3 wget
          wget https://raw.githubusercontent.com/kdrag0n/kramflash/refs/heads/master/mkbootimg.py && sudo ln -sf $(pwd)/mkbootimg.py /usr/bin/mkbootimg && chmod +x /usr/bin/mkbootimg
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Test-key build: the updater mod bundles this cert, so point it at the
          # AOSP test cert the zip actually gets signed with.
          cp security/aosp_testkey.x509.pem security/artisanrom_ota.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build dependencies
        run: |
          source ./buildenv.sh $TARGET
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: source ./buildenv.sh r8s && ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh $TARGET
          ./scripts/extract_fw.sh

      - name: Add swapspace
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 12

      - name: Build ROM
        run: |
          set -o pipefail
          source ./buildenv.sh $TARGET
          FLAGS=""
          if [ "${{ inputs.beta }}" = "true" ]; then FLAGS="--beta"; fi
          ./scripts/make_rom.sh $FLAGS 2>&1 | tee out/r8s-build.log
          ls -la out/*.zip

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8s-build-diagnostics
          path: |
            out/r8s-build.log
            out/config.sh
            out/target/r8s/*.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload failed patch inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8s-patch-context
          path: |
            out/target/r8s/apktool/system/framework/services.jar
            out/target/r8s/apktool/system/framework/framework.jar
            out/target/r8s/apktool/system/priv-app/SecSettings/SecSettings.apk
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload ROM zip
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanROM-r8s-${{ github.run_number }}
          path: out/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
